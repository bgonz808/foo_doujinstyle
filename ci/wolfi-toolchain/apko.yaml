# Resolution candidate only. Never consume before lock and qualification.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - bash
    - busybox
    - coreutils
    - git
    - clang-23=23.1.6-r1
    - clang-23-extras=23.1.6-r1
    - compiler-rt-23=23.1.6-r1
    - glibc-dev
    - glibc-2.44-iconv=2.44-r25
    - libstdc++-dev
    - binutils
    - openssl-dev
    - zlib-dev
    - python-3.12
    - py3.12-lxml=6.1.3-r1
archs:
  - x86_64
environment:
  CC: clang
  CXX: clang++
  PYTHON: python3.12
  HOME: /tmp
work-dir: /src
cmd: /bin/bash
