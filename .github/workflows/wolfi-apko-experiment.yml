name: Wolfi apko feasibility (unqualified)
on:
  push:
    branches: [ci/dependency-updates-v0.0.231, test/quality-report-v0.0.236]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wolfi-apko-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Acquire exact apko release
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/apko"
          mkdir -p "$stage" "$RUNNER_TEMP/apko-evidence"
          curl -fsSL --retry 2 --proto '=https' --tlsv1.2 \
            https://github.com/chainguard-dev/apko/releases/download/v1.5.3/apko_1.5.3_linux_amd64.tar.gz \
            -o "$stage/apko.tar.gz"
          echo "71fada2eaa9a0a05b427b4a54138b706b0c608dc7555370d04a6b2d1b774d10f  $stage/apko.tar.gz" | sha256sum -c -
          tar -xzf "$stage/apko.tar.gz" -C "$stage"
          # Upstream GoReleaser archives use wrap_in_directory: true.
          mapfile -t binaries < <(find "$stage" -type f -name apko)
          if [[ ${#binaries[@]} -ne 1 || ! -x "${binaries[0]}" ]]; then
            echo 'Expected exactly one executable apko in verified archive' >&2
            tar -tzf "$stage/apko.tar.gz" >&2
            exit 1
          fi
          "${binaries[0]}" version
          dirname "${binaries[0]}" >> "$GITHUB_PATH"
          sha256sum "${binaries[0]}" > "$RUNNER_TEMP/apko-evidence/apko-binary.sha256"
      - name: Resolve signed Wolfi package closure and compose with lock
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/apko-evidence"
          start=$SECONDS
          apko lock ci/wolfi-toolchain/apko.yaml --arch x86_64 --output "$evidence/apko.lock.json"
          echo "APKO-METRIC stage=resolve seconds=$((SECONDS-start))"
          start=$SECONDS
          apko build ci/wolfi-toolchain/apko.yaml native-ci:wolfi "$RUNNER_TEMP/wolfi.tar" \
            --arch x86_64 --lockfile "$evidence/apko.lock.json" --sbom-path "$evidence"
          echo "APKO-METRIC stage=compose seconds=$((SECONDS-start)) archive_bytes=$(stat -c '%s' "$RUNNER_TEMP/wolfi.tar")"
          sha256sum "$RUNNER_TEMP/wolfi.tar" > "$evidence/archive.sha256"
          # apko appends the architecture to the loaded image tag.
          docker load --input "$RUNNER_TEMP/wolfi.tar"
          docker image inspect --format '{{.Id}} {{.Size}}' native-ci:wolfi-amd64 | tee "$evidence/image.txt"
          docker save native-ci:wolfi-amd64 | zstd -q -3 -T2 > "$RUNNER_TEMP/wolfi.tar.zst"
          echo "APKO-METRIC stage=zstd archive_bytes=$(stat -c '%s' "$RUNNER_TEMP/wolfi.tar.zst")"
      - name: Execute full contracts and strict analysis offline
        run: |
          set -euo pipefail
          start=$SECONDS
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e PORTABLE_CPP_OPT=1 -e PORTABLE_COVERAGE=1 -e GITHUB_SHA -v "$PWD:/src" -w /src native-ci:wolfi-amd64 \
            bash -euc 'clang++ --version | grep -E "clang version 23[.]1[.]6([[:space:]]|$)"; clang-tidy --version | grep -E "version 23[.]1[.]6([[:space:]]|$)"; python3.12 -c "import lxml.etree; print(lxml.etree.LXML_VERSION)"; bash tools/test_portable.sh'
          echo "APKO-METRIC stage=portable seconds=$((SECONDS-start))"
          start=$SECONDS
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src native-ci:wolfi-amd64 \
            python3.12 -m tools.quality.coverage --binary build-linux/publish_references \
              --profiles build-linux/quality/profiles --source-root native --output build-linux/quality \
              --scope portable-native-publisher
          echo "APKO-METRIC stage=coverage_collect seconds=$((SECONDS-start))"
          start=$SECONDS
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src native-ci:wolfi-amd64 \
            python3.12 native/analyze_native.py --portable build-analysis --clangxx clang++ --clang-tidy clang-tidy --strict --jobs 2 --portable-optimization 1
          echo "APKO-METRIC stage=strict_analysis seconds=$((SECONDS-start))"
      - name: Render measured portable quality evidence
        if: always()
        uses: ./.github/actions/native-quality-report
        with:
          coverage: build-linux/quality/coverage-summary.json
          junit-directory: build-linux/quality/tests
          inventory: build-linux/python-inventory.json
          features: quality/features.json
          version-file: VERSION
          output: build-linux/quality/report
          require-coverage: 'true'
      - name: Retain measured quality evidence (no raw profile or binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wolfi-portable-quality
          path: |
            build-linux/quality/coverage-summary.json
            build-linux/quality/coverage.lcov
            build-linux/quality/tests/
            build-linux/quality/report/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wolfi-apko-candidate-evidence
          path: ${{ runner.temp }}/apko-evidence/
          if-no-files-found: warn
          retention-days: 2
