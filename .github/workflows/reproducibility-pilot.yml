name: Independent Windows reproducibility pilot
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replica:
    # Expensive experiment is opt-in, not a new cost on every PR.
    if: github.repository == 'bgonz808/foo_doujinstyle' && github.actor == github.repository_owner && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/toolchain-matrix-325') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      TARGET_ARCH: x64
      REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Fetch and verify pinned foobar2000 SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.foobar2000.org/downloads/SDK-2026-10-01.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'SDK-2026-10-01.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'd4c55077336fae81bf8df0259b5b2748fa45ea84132c656ead93eb123cbcdc26'
          if ($actual -ne $expected) { throw "foobar SDK digest mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP 'foobar-sdk'
          New-Item -ItemType Directory $dest -Force | Out-Null
          & 7z.exe x $archive "-o$dest" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'SDK extraction failed' }
          $direct = Join-Path $dest 'foobar2000\SDK\foobar2000.h'
          if (!(Test-Path $direct)) {
            $headers = @(Get-ChildItem -LiteralPath $dest -Recurse -Filter foobar2000.h)
            $headers = @($headers | Where-Object { $_.FullName -match 'foobar2000[\\/]SDK[\\/]foobar2000\.h$' })
            if ($headers.Count -ne 1) { throw 'SDK source root ambiguous or missing' }
            $dest = (Resolve-Path (Join-Path $headers[0].Directory.FullName '..\..')).Path
          }
          "FOOBAR_SDK_ROOT=$dest" >> $env:GITHUB_ENV
      - name: Configure verified foobar2000 SDK projects
        run: ./tools/configure_foobar_sdk.ps1 -SdkRoot $env:FOOBAR_SDK_ROOT
      - name: Install documented Microsoft ARM64 and ARM64EC Spectre runtimes
        run: ./tools/install_msvc_spectre.ps1

      - name: Require pinned ARM64EC Spectre CRT before any Windows PE build
        run: ./tools/verify_msvc_runtime.ps1 -Output (Join-Path $env:RUNNER_TEMP 'msvc-runtime.json')
      - name: Fingerprint selected Windows toolchain roots
        run: ./tools/measure_windows_toolchain.ps1 -Output (Join-Path $env:RUNNER_TEMP 'toolchain-inventory.json')
      - name: Verify installed toolchain against candidate lock
        run: |
          py -3 -m unittest -v tools.test_toolchain_lock
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain lock tests failed' }
          py -3 -m tools.toolchain_lock --lock tools/windows-toolchain-lock.json --inventory (Join-Path $env:RUNNER_TEMP 'toolchain-inventory.json') --output (Join-Path $env:RUNNER_TEMP 'toolchain-lock-verdict.json')
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain lock mismatch' }
      - name: Record pre-build source receipt
        run: |
          py -3 -m tools.reproducibility source --output (Join-Path $env:RUNNER_TEMP 'source-before.json')
          if ($LASTEXITCODE -ne 0) { throw 'Pre-build source receipt failed' }
      - name: Compile one architecture using exact MSVC pins
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & py -3 tools/build_identity.py | ConvertFrom-Json
          if ($version.dirty) { throw 'Dirty source tree' }
          $env:DoujinStageReplayDir = Join-Path $env:RUNNER_TEMP 'worker-link-repro'
          New-Item -ItemType Directory $env:DoujinStageReplayDir | Out-Null
          $env:DoujinComponentReplayDir = Join-Path $env:RUNNER_TEMP 'component-link-repro'
          New-Item -ItemType Directory $env:DoujinComponentReplayDir | Out-Null
          ./native/build.ps1 -SdkRoot $env:FOOBAR_SDK_ROOT -Platform $env:TARGET_ARCH -WindowsSdkVersion '10.0.26100.0' -MsvcToolsVersion '14.44.35207' -PinnedMsvcOnly -VerifySharedSqliteCompilation
      - name: Record exact PE, PDB and package identities
        run: |
          py -3 -m tools.reproducibility capture --build native/build --runtime (Join-Path $env:RUNNER_TEMP 'msvc-runtime.json') --replica $env:REPLICA --lock-verdict (Join-Path $env:RUNNER_TEMP 'toolchain-lock-verdict.json') --inventory (Join-Path $env:RUNNER_TEMP 'toolchain-inventory.json') --before (Join-Path $env:RUNNER_TEMP 'source-before.json') --output (Join-Path $env:RUNNER_TEMP 'repro-record.json')
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete reproducibility evidence' }
      - name: Retain only sanitized reproducibility record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repro-${{ matrix.replica }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repro-record.json
          if-no-files-found: error
          retention-days: 14
      - name: Provision pinned read-only LLVM forensic tools
        if: matrix.replica == 'a'
        run: ./tools/provision_llvm_forensics.ps1
      - name: Replay librarian, worker and component native linker inputs
        if: matrix.replica == 'a'
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath)
          if ($LASTEXITCODE -or $vs.Count -ne 1) { throw 'Ambiguous Visual Studio installation' }
          $tool = Join-Path $vs[0] 'VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64'
          py -3 -m unittest -v tools.test_stage_replay
          if ($LASTEXITCODE -ne 0) { throw 'Stage replay tests failed' }
          $msbuild = Join-Path $vs[0] 'MSBuild\Current\Bin\MSBuild.exe'
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\10.0.26100.0\x64'
          py -3 -m tools.stage_replay --tool-dir $tool --msbuild $msbuild --sdk-bin $sdkBin --sdk $env:FOOBAR_SDK_ROOT --bundle (Join-Path $env:RUNNER_TEMP 'worker-link-repro') --component-bundle (Join-Path $env:RUNNER_TEMP 'component-link-repro') --llvm-bin $env:LLVM_FORENSIC_BIN --output (Join-Path $env:RUNNER_TEMP 'stage-replay.json')
          if ($LASTEXITCODE -ne 0) { throw 'Stage replay incomplete' }
      - name: Retain sanitized stage replay report
        if: always() && matrix.replica == 'a'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stage-replay-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage-replay.json
          if-no-files-found: warn
          retention-days: 14
  sqlite-only:
    if: github.repository == 'bgonz808/foo_doujinstyle' && github.actor == github.repository_owner && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/sqlite-librarian-326') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Measure native deterministic compiler flags on relocated SQLite sources
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath)
          if ($LASTEXITCODE -or $vs.Count -ne 1) { throw 'Ambiguous Visual Studio installation' }
          $msbuild = Join-Path $vs[0] 'MSBuild\Current\Bin\MSBuild.exe'
          py -3 -m unittest -v tools.test_sqlite_repro
          if ($LASTEXITCODE -ne 0) { throw 'Deterministic profile tests failed' }
          $lib = Join-Path $vs[0] 'VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\lib.exe'
          py -3 -m tools.sqlite_repro --msbuild $msbuild --lib $lib --replica '${{ matrix.replica }}' --output (Join-Path $env:RUNNER_TEMP 'sqlite-only.json')
          if ($LASTEXITCODE -ne 0) { throw 'Standalone SQLite experiment failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sqlite-only-${{ matrix.replica }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-only.json
          if-no-files-found: error
          retention-days: 14
  toolchain-matrix:
    if: github.repository == 'bgonz808/foo_doujinstyle' && github.actor == github.repository_owner && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/toolchain-matrix-325') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Verify forensic selection and matrix contracts
        run: |
          py -3 -m unittest -v tools.test_llvm_archive_selection tools.test_artifact_forensics tools.test_toolchain_matrix
          if ($LASTEXITCODE) { throw 'Matrix contracts failed' }
      - name: Provision pinned LLVM
        run: ./tools/provision_llvm_forensics.ps1
      - name: Compare compiler librarian and linker combinations
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath)
          if ($LASTEXITCODE -or $vs.Count -ne 1) { throw 'Ambiguous Visual Studio installation' }
          $tool = Join-Path $vs[0] 'VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64'
          py -3 -m tools.toolchain_matrix --msvc-bin $tool --llvm-bin $env:LLVM_FORENSIC_BIN --replica '${{ matrix.replica }}' --output (Join-Path $env:RUNNER_TEMP 'toolchain-matrix.json')
          if ($LASTEXITCODE) { throw 'Toolchain matrix incomplete' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: toolchain-matrix-${{ matrix.replica }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/toolchain-matrix.json
          if-no-files-found: error
          retention-days: 14
  sqlite-frozen:
    if: github.repository == 'bgonz808/foo_doujinstyle' && github.actor == github.repository_owner && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/sqlite-frozen-331') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Verify frozen input contracts
        run: |
          py -3 -m unittest -v tools.test_sqlite_frozen_repro
          if ($LASTEXITCODE) { throw 'Frozen input contracts failed' }
      - name: Provision pinned LLVM for semantic object inspection
        run: ./tools/provision_llvm_forensics.ps1
      - name: Repeat source and frozen preprocessed SQLite compilation
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath)
          if ($LASTEXITCODE -or $vs.Count -ne 1) { throw 'Ambiguous Visual Studio installation' }
          $tool = Join-Path $vs[0] 'VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64'
          $msbuild = Join-Path $vs[0] 'MSBuild\Current\Bin\MSBuild.exe'
          py -3 -m tools.sqlite_frozen_repro --msbuild $msbuild --msvc-bin $tool --llvm-bin $env:LLVM_FORENSIC_BIN --replica '${{ matrix.replica }}' --output (Join-Path $env:RUNNER_TEMP 'sqlite-frozen.json')
          if ($LASTEXITCODE) { throw 'Frozen input experiment incomplete' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sqlite-frozen-${{ matrix.replica }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-frozen.json
          if-no-files-found: error
          retention-days: 14
  process-trace:
    if: github.repository == 'bgonz808/foo_doujinstyle' && github.actor == github.repository_owner && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/process-trace-333') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Verify process trace contracts
        run: |
          py -3 -m unittest -v tools.test_build_process_trace
          if ($LASTEXITCODE) { throw 'Process trace contracts failed' }
      - name: Compare traced and untraced mapped SQLite builds
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath)
          if ($LASTEXITCODE -or $vs.Count -ne 1) { throw 'Ambiguous Visual Studio installation' }
          $msbuild = Join-Path $vs[0] 'MSBuild\Current\Bin\MSBuild.exe'
          py -3 -m tools.build_process_trace --msbuild $msbuild --replica '${{ matrix.replica }}' --output (Join-Path $env:RUNNER_TEMP 'build-process-trace.json')
          if ($LASTEXITCODE) { throw 'Process trace experiment incomplete' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: build-process-trace-${{ matrix.replica }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-process-trace.json
          if-no-files-found: error
          retention-days: 14
  worker-repro:
    if: github.repository == 'bgonz808/foo_doujinstyle' && github.actor == github.repository_owner && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/worker-repro-328') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Verify worker experiment contracts
        run: |
          py -3 -m unittest -v tools.test_worker_repro tools.test_source_link
          if ($LASTEXITCODE) { throw 'Worker reproducibility contracts failed' }
      - name: Install documented Microsoft ARM64 and ARM64EC Spectre runtimes
        run: ./tools/install_msvc_spectre.ps1
      - name: Require pinned Spectre CRT before worker build
        run: ./tools/verify_msvc_runtime.ps1 -Output (Join-Path $env:RUNNER_TEMP 'worker-msvc-runtime.json')
      - name: Provision pinned LLVM
        run: ./tools/provision_llvm_forensics.ps1
      - name: Measure actual worker and frozen linker replay
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath)
          if ($LASTEXITCODE -or $vs.Count -ne 1) { throw 'Ambiguous Visual Studio installation' }
          $tool = Join-Path $vs[0] 'VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64'
          $msbuild = Join-Path $vs[0] 'MSBuild\Current\Bin\MSBuild.exe'
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\10.0.26100.0\x64'
          py -3 -m tools.worker_repro --msbuild $msbuild --msvc-bin $tool --sdk-bin $sdkBin --llvm-bin $env:LLVM_FORENSIC_BIN --replica '${{ matrix.replica }}' --output (Join-Path $env:RUNNER_TEMP 'worker-repro.json')
          if ($LASTEXITCODE) { throw 'Worker experiment incomplete' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: worker-repro-${{ matrix.replica }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-repro.json
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: [replica]
    # Replica captures are uploaded before stage replay; keep comparison even
    # when replay fails. Missing evidence still fails the download/compare gate.
    if: always() && (needs.replica.result == 'success' || needs.replica.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: repro-a-attempt-${{ github.run_attempt }}
          path: repro/a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: repro-b-attempt-${{ github.run_attempt }}
          path: repro/b
      - name: Verify evidence and report baseline differences
        run: |
          python3 -m unittest -v tools.test_reproducibility
          python3 -m tools.reproducibility compare --a repro/a/repro-record.json --b repro/b/repro-record.json --output "$RUNNER_TEMP/reproducibility.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reproducibility-pilot-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reproducibility.json
          if-no-files-found: error
          retention-days: 14
