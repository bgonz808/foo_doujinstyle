name: Native foreground search coordinator contracts
on:
  push:
    branches: [migration/native-foreground-search]
  pull_request:
    branches: [test/host-e2e-preflight, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and execute native foreground coordinator contract
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O0 -g0 -Wall -Wextra -Werror -I native native/test_catalog_search_frontend.cpp -o "$RUNNER_TEMP/search_frontend"
          "$RUNNER_TEMP/search_frontend"
      - name: Provision isolated, pinned Python reference-test dependency
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/native-test-venv"
          "$RUNNER_TEMP/native-test-venv/bin/python" -m pip install --disable-pip-version-check 'lxml==5.4.0'
      - name: Compile entire native publisher and run existing offline integration/parity suite
        run: |
          set -euo pipefail
          PYTHON="$RUNNER_TEMP/native-test-venv/bin/python" bash tools/test_portable.sh
