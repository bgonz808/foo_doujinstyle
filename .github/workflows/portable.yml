name: Portable C++ and contract tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provision exact compiler closure and locked portable test dependency
        run: |
          set -euo pipefail
          bash tools/provision_llvm.sh compile
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r tools/requirements-portable.lock
      - name: Version and native contract suite (offline)
        run: |
          CC=clang-23 CXX=clang++-23 PYTHON="$PWD/.venv/bin/python" bash tools/test_portable.sh
          .venv/bin/python tools/build_identity.py | .venv/bin/python -c 'import json, sys; identity = json.load(sys.stdin); assert not identity["dirty"], identity'
      - name: Render source-attributed quality evidence (no repeated tests)
        if: always()
        uses: ./.github/actions/native-quality-report
        with:
          junit-directory: build-linux/quality/tests
          inventory: build-linux/python-inventory.json
          features: quality/features.json
          version-file: VERSION
          output: build-linux/quality/report
      - name: Retain sanitized portable quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portable-quality
          path: |
            build-linux/quality/tests/
            build-linux/quality/report/
          if-no-files-found: error
          retention-days: 14
  native-static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provision exact LLVM analyzer closure
        run: bash tools/provision_llvm.sh analysis
      - name: Run strict first-party Clang Static Analyzer and clang-tidy
        run: |
          python3 native/analyze_native.py --portable build-analysis --clangxx clang++-23 --clang-tidy clang-tidy-23 --strict --jobs 2
