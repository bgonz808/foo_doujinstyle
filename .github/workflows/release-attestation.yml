name: Manually reviewed binary attestation
on:
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Full approved main commit SHA (40 lowercase hex)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: reviewed-release-attestation
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event.inputs.approved_source_sha == github.sha
    uses: ./.github/workflows/windows-build.yml
    permissions:
      contents: read
  attest:
    if: github.ref == 'refs/heads/main' && github.event.inputs.approved_source_sha == github.sha
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: signed-releases
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact trusted source with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download exact package built by the reusable workflow in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foo_doujinstyle-windows-wip
          path: dist/package
      - name: Download six-PE BinSkim evidence from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foo_doujinstyle-binskim-evidence
          path: dist/evidence
      - name: Prove same source commit and SHA-bound passed security gate
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          python3 -m tools.attestation_gate \
            --package-dir dist/package --evidence-dir dist/evidence \
            --source-commit "$SOURCE_COMMIT" --run-id "$CI_RUN_ID" \
            --output dist/security-predicate.json
      - name: Sign standard build provenance for exact package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/package/*.fb2k-component
      - name: Sign six-PE security evidence for same package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/package/*.fb2k-component
          predicate-type: https://github.com/bgonz808/foo_doujinstyle/security/attestation-v1
          predicate-path: dist/security-predicate.json
