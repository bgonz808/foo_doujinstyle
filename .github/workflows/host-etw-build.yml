name: Windows x64 ETW test component (unqualified)
on:
  pull_request:
    branches: [main]
  # Main-only artifacts retain the actual merged source SHA, not a PR synthetic merge SHA.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-etw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-trace-build:
    runs-on: windows-2022
    outputs:
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test trace isolation, event contracts and project opt-in
        run: py -3 -m unittest -v tools.test_host_trace_build
      - name: Download official SHA256-pinned foobar2000 SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.foobar2000.org/downloads/SDK-2026-10-01.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'SDK-2026-10-01.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'd4c55077336fae81bf8df0259b5b2748fa45ea84132c656ead93eb123cbcdc26') {
            throw 'foobar SDK digest mismatch'
          }
          $root = Join-Path $env:RUNNER_TEMP 'foobar-sdk'
          New-Item -ItemType Directory $root -Force | Out-Null
          & 7z.exe x $archive "-o$root" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'SDK extraction failed' }
          $direct = Join-Path $root 'foobar2000\SDK\foobar2000.h'
          if (!(Test-Path $direct)) {
            $headers = @(Get-ChildItem -LiteralPath $root -Recurse -Filter foobar2000.h |
              Where-Object { $_.FullName -match 'foobar2000[\\/]SDK[\\/]foobar2000\.h$' })
            if ($headers.Count -ne 1) { throw 'SDK source root ambiguous or missing' }
            $root = (Resolve-Path (Join-Path $headers[0].Directory.FullName '..\..')).Path
          }
          "FOOBAR_SDK_ROOT=$root" >> $env:GITHUB_ENV
      - name: Apply same Spectre mitigations to verified SDK projects
        run: ./tools/configure_foobar_sdk.ps1 -SdkRoot $env:FOOBAR_SDK_ROOT
      - name: Install pinned MSVC ARM64 Spectre components and verify CRTs
        run: |
          ./tools/install_msvc_spectre.ps1
          ./tools/verify_msvc_runtime.ps1 -Output (Join-Path $env:RUNNER_TEMP 'msvc-trace-runtime.json')
      - name: Build isolated x64 ETW component using pinned VS2022 MSVC
        run: |
          $ErrorActionPreference = 'Stop'
          ./native/build.ps1 -SdkRoot $env:FOOBAR_SDK_ROOT -Platform x64 `
            -WindowsSdkVersion '10.0.26100.0' -MsvcToolsVersion '14.44.35207' -E2ETrace -VerifySharedSqliteCompilation
          py -3 tools/verify_pe_targets.py --build-dir native/build --require x64
          $items = @(Get-ChildItem -LiteralPath 'native/build' -File -Filter '*-e2e-trace.fb2k-component')
          if ($items.Count -ne 1) { throw 'Expected exactly one test-only ETW component' }
          $plain = @(Get-ChildItem -LiteralPath 'native/build' -File -Filter '*.fb2k-component' |
            Where-Object { $_.Name -notlike '*-e2e-trace.fb2k-component' })
          if ($plain.Count -ne 0) { throw 'Test-only builder unexpectedly created a release package' }
          $p = $items[0]
          $env:TRACE_PACKAGE = $p.FullName
          py -3 -c "from pathlib import Path; from zipfile import ZipFile; import hashlib,os; p=Path(os.environ['TRACE_PACKAGE']); z=ZipFile(p); members=[n for n in z.namelist() if n.endswith('.dll')]; assert members==['x64/foo_doujinstyle.dll'],members; raw=z.read(members[0]); assert hashlib.sha256(raw).digest()==hashlib.sha256(Path('native/build/x64/foo_doujinstyle.dll').read_bytes()).digest(); print('PASS: test-only x64 package contents match native DLL')"
          Write-Host "Test-only artifact: $($p.Name)"
          Write-Host "Test-only SHA256: $((Get-FileHash -LiteralPath $p.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
      - name: Parse strict offline Windows ETW export script
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'e2e/host/discover_uia.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - name: Exercise real Windows native ETW transport (not host playback)
        run: ./e2e/host/etw_roundtrip.ps1 -Output (Join-Path $env:RUNNER_TEMP 'etw-roundtrip')
      - name: Exercise actual process-scoped Windows UI Automation (synthetic window only)
        run: py -3 -m e2e.host.uia_probe --output (Join-Path $env:RUNNER_TEMP 'uia-roundtrip')
      - name: Upload synthetic UI Automation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-uia-transport-only
          path: ${{ runner.temp }}/uia-roundtrip/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload native ETW transport evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-etw-transport-only
          path: |
            ${{ runner.temp }}/etw-roundtrip/roundtrip.json
            ${{ runner.temp }}/etw-roundtrip/etw_export.exe
          if-no-files-found: error
          retention-days: 14
      - name: Bind exact checkout and test-only build inputs
        id: receipt
        run: |
          $p = @(Get-ChildItem -LiteralPath 'native/build' -File -Filter '*-e2e-trace.fb2k-component')
          if ($p.Count -ne 1) { throw 'Expected one test package' }
          py -3 -m e2e.host.build_receipt --package $p[0].FullName --exporter (Join-Path $env:RUNNER_TEMP 'etw-roundtrip/etw_export.exe') --dll native/build/x64/foo_doujinstyle.dll --output (Join-Path $env:RUNNER_TEMP 'host-build-receipt.json')
          if ($LASTEXITCODE -ne 0) { throw 'Receipt generation failed' }
          "sha256=$((Get-FileHash -LiteralPath (Join-Path $env:RUNNER_TEMP 'host-build-receipt.json') -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Upload source-bound test build receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-test-build-receipt
          path: ${{ runner.temp }}/host-build-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload test-only x64 ETW package (not production-qualified)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foo_doujinstyle-x64-e2e-unqualified
          path: native/build/*-e2e-trace.fb2k-component
          if-no-files-found: error
          retention-days: 14

  hosted-playback-pilot:
    needs: [host-trace-build]
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: host-test-build-receipt
          path: ${{ runner.temp }}/host-inputs/receipt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: host-etw-transport-only
          path: ${{ runner.temp }}/host-inputs/exporter
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: foo_doujinstyle-x64-e2e-unqualified
          path: ${{ runner.temp }}/host-inputs/package
      - name: Provision pinned publisher host and Robot once
        run: |
          $ErrorActionPreference = 'Stop'
          $sw=[Diagnostics.Stopwatch]::StartNew()
          $root=Join-Path $env:RUNNER_TEMP 'host-inputs'
          $installer=Join-Path $root 'foobar2000-x64_v2.26.1.exe'
          $base=Join-Path $root 'base'
          $url='https://www.foobar2000.org/files/foobar2000-x64_v2.26.1.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRedirection 0
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '72fe15a88b085ee4e49d68114e2bb9655000c2e0fdf40dcc128bbef8bcaf3600') {throw 'Publisher installer pin mismatch'}
          $sig=Get-AuthenticodeSignature $installer
          Write-Host "Installer signature: $($sig.Status)"
          if ($sig.Status -ne 'Valid') {throw 'Pinned installer Authenticode verification failed'}
          Write-Host "HOST-PROVISION-STAGE installer_ms=$($sw.ElapsedMilliseconds)"
          New-Item -ItemType Directory -Path $base | Out-Null
          & 7z.exe x $installer "-o$base" -y | Out-Null
          if ($LASTEXITCODE -ne 0) {throw 'Installer extraction failed'}
          Get-ChildItem -LiteralPath $base -Force | Where-Object {$_.Name.StartsWith('$')} | Remove-Item -Recurse -Force
          New-Item -ItemType File -Path (Join-Path $base 'portable_mode_enabled') | Out-Null
          if (!(Test-Path -LiteralPath (Join-Path $base 'foobar2000.exe'))) {throw 'Expected portable host missing'}
          Write-Host "HOST-PROVISION-STAGE extract_ms=$($sw.ElapsedMilliseconds)"
          py -3 -m venv (Join-Path $root 'venv')
          if ($LASTEXITCODE -ne 0) {throw 'venv failed'}
          $python=Join-Path $root 'venv/Scripts/python.exe'
          Write-Host "HOST-PROVISION-STAGE venv_ms=$($sw.ElapsedMilliseconds)"
          & $python -m pip --isolated install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r e2e/host/hosted_requirements.txt
          if ($LASTEXITCODE -ne 0) {throw 'Pinned Robot installation failed'}
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) {throw 'Dependency check failed'}
          & $python -c "import os,sys; from pathlib import Path; from e2e.host.windows_process import process_ids,host_module_status; assert os.getpid() in process_ids(Path(sys.executable).name); assert not host_module_status(os.getpid())['doujinstyle_loaded']; print('Native process inventory PASS')"
          if ($LASTEXITCODE -ne 0) {throw 'Native process inventory smoke failed'}
          Write-Host "HOST-PROVISION-MS $($sw.ElapsedMilliseconds)"
          @{schema_version=1; provisioning_ms=$sw.ElapsedMilliseconds; installer_signature=[string]$sig.Status; runner_image=$env:ImageVersion; python=(& $python --version)} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 (Join-Path $root 'provisioning.json')
      - name: Actual foobar2000 paired synthetic playback (hosted grade)
        env:
          RECEIPT_SHA256: ${{ needs.host-trace-build.outputs.receipt_sha256 }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'host-inputs'
          $python=Join-Path $root 'venv/Scripts/python.exe'
          $p=@(Get-ChildItem -LiteralPath (Join-Path $root 'package') -File -Filter '*-e2e-trace.fb2k-component')
          if ($p.Count -ne 1) {throw 'Expected one same-run test package'}
          & $python -m e2e.host.hosted_pilot --base (Join-Path $root 'base') --output (Join-Path $env:RUNNER_TEMP 'host-pilot') --receipt (Join-Path $root 'receipt/host-build-receipt.json') --receipt-sha256 $env:RECEIPT_SHA256 --trials 5 --package $p[0].FullName --exporter (Join-Path $root 'exporter/etw_export.exe')
          if ($LASTEXITCODE -ne 0) {throw 'Actual hosted playback pilot did not qualify'}
      - name: Retain synthetic evidence only, never publisher binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-playback-pilot-evidence
          path: |
            ${{ runner.temp }}/host-inputs/provisioning.json
            ${{ runner.temp }}/host-pilot/pilot.json
            ${{ runner.temp }}/host-pilot/manifest.json
            ${{ runner.temp }}/host-pilot/paired-report.json
            ${{ runner.temp }}/host-pilot/trials/*/paired-report.json
            ${{ runner.temp }}/host-pilot/trials/*/anchors/readiness.json
            ${{ runner.temp }}/host-pilot/trials/*/anchors/*/checkpoint.json
            ${{ runner.temp }}/host-pilot/trials/*/anchors/*/trace/*
            ${{ runner.temp }}/host-pilot/trials/*/anchors/*/fixture/*.json
            ${{ runner.temp }}/host-pilot/trials/*/anchors/*/fixture/local-control.wav
            ${{ runner.temp }}/host-pilot/trials/*/anchors/*/robot/*.xml
            ${{ runner.temp }}/host-pilot/trials/*/anchors/*/robot/cli-host.json
          if-no-files-found: warn
          retention-days: 14
