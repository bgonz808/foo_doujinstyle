name: Windows Build and BinSkim
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: winbuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  architecture:
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64, ARM64EC]
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Windows PowerShell build script parses
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'native/build.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - name: Fetch and verify pinned foobar2000 SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.foobar2000.org/downloads/SDK-2026-10-01.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'SDK-2026-10-01.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'd4c55077336fae81bf8df0259b5b2748fa45ea84132c656ead93eb123cbcdc26'
          if ($actual -ne $expected) { throw "foobar SDK digest mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP 'foobar-sdk'
          New-Item -ItemType Directory $dest -Force | Out-Null
          & 7z.exe x $archive "-o$dest" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'SDK extraction failed' }
          $direct = Join-Path $dest 'foobar2000\SDK\foobar2000.h'
          if (!(Test-Path $direct)) {
            $headers = @(Get-ChildItem -LiteralPath $dest -Recurse -Filter foobar2000.h)
            $headers = @($headers | Where-Object { $_.FullName -match 'foobar2000[\\/]SDK[\\/]foobar2000\.h$' })
            if ($headers.Count -ne 1) { throw 'SDK source root ambiguous or missing' }
            $dest = (Resolve-Path (Join-Path $headers[0].Directory.FullName '..\..')).Path
          }
          "FOOBAR_SDK_ROOT=$dest" >> $env:GITHUB_ENV
      - name: Configure verified foobar2000 SDK projects
        run: ./tools/configure_foobar_sdk.ps1 -SdkRoot $env:FOOBAR_SDK_ROOT
      - name: Install documented Microsoft ARM64 and ARM64EC Spectre runtimes
        run: ./tools/install_msvc_spectre.ps1

      - name: Require pinned ARM64EC Spectre CRT before any Windows PE build
        run: ./tools/verify_msvc_runtime.ps1 -Output (Join-Path $env:RUNNER_TEMP 'msvc-runtime.json')
      - name: Enforce approved toolchain for release-stage source
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = (Get-Content -Raw RELEASE_STAGE).Trim()
          if ($stage -eq 'dev') {
            Write-Host 'Development stage: standard pinned tools; full content inventory in opt-in pilot'
          } else {
            ./tools/measure_windows_toolchain.ps1 -Output (Join-Path $env:RUNNER_TEMP 'toolchain-inventory.json')
            py -3 -m tools.toolchain_lock --release --lock tools/windows-toolchain-lock.json --inventory (Join-Path $env:RUNNER_TEMP 'toolchain-inventory.json') --output (Join-Path $env:RUNNER_TEMP 'toolchain-lock-verdict.json')
            if ($LASTEXITCODE -ne 0) { throw 'Release toolchain not approved' }
          }
      - name: Compile one architecture using exact MSVC pins
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & py -3 tools/build_identity.py | ConvertFrom-Json
          if ($version.dirty) { throw 'Dirty source tree' }
          ./tools/test_build_profile.ps1
          ./native/build.ps1 -SdkRoot $env:FOOBAR_SDK_ROOT -Platform $env:TARGET_ARCH -VerifySharedSqliteCompilation
      - name: Verify local PE identity and worker embedding
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $link = @(& $vswhere -latest -products '*' -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\link.exe' | Where-Object { $_ -match '[\\/]14[.]44[.]35207[\\/]' })
          if ($link.Count -ne 1) { throw 'Pinned linker unavailable' }
          py -3 tools/verify_pe_targets.py --build-dir native/build --require $env:TARGET_ARCH --link-exe $link[0]
          if ($LASTEXITCODE -ne 0) { throw 'PE architecture failed' }
          py -3 -c "from pathlib import Path; import os,hashlib; from zipfile import ZipFile; b=Path('native/build'); a=os.environ['TARGET_ARCH']; d=b/a; dll=(d/'foo_doujinstyle.dll').read_bytes(); worker=(d/'publish_references.exe').read_bytes(); assert len(worker)>256 and worker in dll; p=list(b.glob('*.fb2k-component')); assert len(p)==1; z=ZipFile(p[0]); names=[n for n in z.namelist() if n.endswith('.dll')]; expected={'Win32':'foo_doujinstyle.dll','x64':'x64/foo_doujinstyle.dll','ARM64EC':'arm64ec/foo_doujinstyle.dll'}; assert names==[expected[a]] and z.read(names[0])==dll; print('MATRIX-METRIC arch='+a+' dll_sha256='+hashlib.sha256(dll).hexdigest()+' worker_sha256='+hashlib.sha256(worker).hexdigest())"
          if ($LASTEXITCODE -ne 0) { throw 'Package/worker binding failed' }
          py -3 native/embed_worker.py --verify "native/build/generated/$env:TARGET_ARCH/native_worker_payload.inc" "native/build/$env:TARGET_ARCH/publish_references.exe" "native/build/$env:TARGET_ARCH/foo_doujinstyle.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Native-only worker embedding failed' }
          if ($env:TARGET_ARCH -ne 'ARM64EC') {
            $env:DOUJINSTYLE_TEST_PUBLISHER = (Resolve-Path "native/build/$env:TARGET_ARCH/publish_references.exe").Path
            & $env:DOUJINSTYLE_TEST_PUBLISHER --version
            if ($LASTEXITCODE -ne 0) { throw 'Worker execution failed' }
            py -3 -m unittest -v native.test_catalog_index_plan_ipc.NativeIndexPlanTests
            if ($LASTEXITCODE -ne 0) { throw 'Worker SQLite contracts failed' }
          }
      - name: Local two-PE BinSkim and mitigation gate
        run: ./tools/run_binskim.ps1 -Architecture $env:TARGET_ARCH
      - name: Fetch and verify official pinned LLVM 23.1.6 for Windows
        if: matrix.arch == 'x64'
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '23.1.6'
          $asset = "clang+llvm-$version-x86_64-pc-windows-msvc.tar.zst"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$asset"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $clock = [Diagnostics.Stopwatch]::StartNew()
          Invoke-WebRequest -Uri $url -OutFile $archive
          Write-Host "LLVM-METRIC stage=download seconds=$([Math]::Round($clock.Elapsed.TotalSeconds,3)) bytes=$((Get-Item -LiteralPath $archive).Length) compression=zstd"
          $clock.Restart()
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '7623f582089983c1cb51030cf1996514b19464e5669099571b399e8543770155'
          if ($digest -ne $expected) { throw "LLVM release digest mismatch: $digest" }
          Write-Host "LLVM-METRIC stage=archive_verify seconds=$([Math]::Round($clock.Elapsed.TotalSeconds,3))"
          $clock.Restart()
          $phase = [Diagnostics.Stopwatch]::StartNew()
          $stage = Join-Path $env:RUNNER_TEMP 'llvm-23.1.6'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          py -3 -m unittest -v tools.test_llvm_archive_selection
          if ($LASTEXITCODE -ne 0) { throw 'LLVM selection contract tests failed' }
          $decoder = (Get-Command 7z.exe -CommandType Application -ErrorAction Stop).Source
          py -3 -m tools.llvm_archive_selection --archive $archive --decoder $decoder --destination $stage
          if ($LASTEXITCODE -ne 0) { throw 'Pinned LLVM streaming extraction failed' }
          $phase.Restart()
          $found = @(Get-ChildItem -LiteralPath $stage -Recurse -File -Filter 'clang-cl.exe')
          if ($found.Count -ne 1) { throw "Expected exactly one LLVM clang-cl.exe, found $($found.Count)" }
          $llvm = (Resolve-Path (Join-Path $found[0].DirectoryName '..')).Path
          Write-Host "LLVM-METRIC stage=locate seconds=$([Math]::Round($phase.Elapsed.TotalSeconds,3))"
          $phase.Restart()
          foreach ($name in @('clang-cl.exe', 'clang-tidy.exe', 'lld-link.exe', 'llvm-readobj.exe')) {
            if (!(Test-Path (Join-Path $llvm "bin\$name"))) { throw "Pinned LLVM missing $name" }
          }
          Write-Host "LLVM-METRIC stage=presence seconds=$([Math]::Round($phase.Elapsed.TotalSeconds,3))"
          # Verify known binary digests before executing even the version probes.
          $knownTools = @{
            'clang-cl.exe' = '0d1fb4523a41c8ec722cdb72909a0a8fff1343700125b3f11d5cf83063a4d7e3'
            'clang-tidy.exe' = '5d6310f76e6f7055a3bafe9bac2d36b4d7cfc58a8c5cad913cc0ec30090b9529'
          }
          foreach ($name in ($knownTools.Keys | Sort-Object)) {
            $phase.Restart()
            $toolPath = Join-Path $llvm "bin\$name"
            $actual = (Get-FileHash -LiteralPath $toolPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $knownTools[$name]) { throw "LLVM binary changed across archive formats: $name" }
            Write-Host "LLVM-METRIC stage=tool_hash tool=$name seconds=$([Math]::Round($phase.Elapsed.TotalSeconds,3)) bytes=$((Get-Item -LiteralPath $toolPath).Length)"
          }
          $phase.Restart()
          $banner = (& (Join-Path $llvm 'bin\clang-cl.exe') --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $banner -notmatch 'clang version 23\.1\.6\b') { throw "Unexpected compiler: $banner" }
          Write-Host "LLVM-METRIC stage=version_probe tool=clang-cl.exe seconds=$([Math]::Round($phase.Elapsed.TotalSeconds,3))"
          $phase.Restart()
          $tidy = (& (Join-Path $llvm 'bin\clang-tidy.exe') --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $tidy -notmatch 'version 23\.1\.6\b') { throw "Unexpected clang-tidy: $tidy" }
          Write-Host "LLVM-METRIC stage=version_probe tool=clang-tidy.exe seconds=$([Math]::Round($phase.Elapsed.TotalSeconds,3))"
          Write-Host "LLVM-METRIC stage=extract_and_verify seconds=$([Math]::Round($clock.Elapsed.TotalSeconds,3))"
          "LLVM_INSTALL_DIR=$llvm" >> $env:GITHUB_ENV
          Write-Host "Pinned LLVM $version SHA-256 $digest"
      - name: Strict Windows x64 first-party Clang analysis from actual compiler commands
        if: matrix.arch == 'x64'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3 -m unittest -v tools.test_windows_analysis
          if ($LASTEXITCODE -ne 0) { throw 'Windows analysis contract tests failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe')
          if ($msbuild.Count -ne 1) { throw 'MSBuild executable missing or ambiguous' }
          py -3 native/analyze_windows.py --msbuild $msbuild[0] --sdk $env:FOOBAR_SDK_ROOT `
            --llvm-bin (Join-Path $env:LLVM_INSTALL_DIR 'bin') --platform x64 --jobs 3 `
            --output (Join-Path $env:RUNNER_TEMP 'windows-analysis') --evidence dist/windows-analysis.json
          if ($LASTEXITCODE -ne 0) { throw 'Strict Windows Clang analysis failed' }
      - name: Seal exact local scan and PE identities
        run: |
          py -3 -m tools.windows_matrix seal --arch $env:TARGET_ARCH --build native/build `
            --reports (Join-Path $env:RUNNER_TEMP 'binskim-sarif') `
            --runtime (Join-Path $env:RUNNER_TEMP 'msvc-runtime.json') `
            --analysis dist/windows-analysis.json --output dist/lane
          if ($LASTEXITCODE -ne 0) { throw 'Lane evidence sealing failed' }
      - name: Upload exact-run architecture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-lane-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: dist/lane/
          if-no-files-found: error
          retention-days: 7
      - name: Collect sanitized diagnostics on failure
        if: failure()
        run: |
          py -3 -m tools.binskim_evidence --architecture $env:TARGET_ARCH --build native/build `
            --reports (Join-Path $env:RUNNER_TEMP 'binskim-sarif') `
            --baseline tools/binskim-baseline.json --policy security/bin-policy.json `
            --version-file VERSION --output dist/failure
      - name: Retain failed lane evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-failure-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: dist/failure/
          if-no-files-found: warn
          retention-days: 14

  component:
    needs: [architecture]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require all architecture jobs passed
        env:
          MATRIX_RESULT: ${{ needs.architecture.result }}
        run: test "$MATRIX_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Win32 from this run and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-lane-Win32-attempt-${{ github.run_attempt }}
          path: dist/lanes/Win32
      - name: Download x64 from this run and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-lane-x64-attempt-${{ github.run_attempt }}
          path: dist/lanes/x64
      - name: Download ARM64EC from this run and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-lane-ARM64EC-attempt-${{ github.run_attempt }}
          path: dist/lanes/ARM64EC
      - name: Test exact-run aggregation and existing security policies
        run: |
          python3 -m unittest -v tools.test_windows_matrix tools.test_windows_projects tools.test_source_sbom tools.test_verify_pe_targets tools.test_binskim_policy tools.test_binskim_evidence tools.test_binskim_diagnostics tools.test_spectre_configuration tools.test_attestation_gate
      - name: Assemble exact scanned package and recheck all six PE reports
        run: |
          python3 -m tools.windows_matrix aggregate --lanes dist/lanes --build dist/build --output dist/evidence
          python3 -m tools.source_sbom --root . --commit "$GITHUB_SHA" --output dist/evidence/source-inputs.spdx.json
          python3 -m tools.attestation_gate --package-dir dist/build --evidence-dir dist/evidence --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output dist/verified-predicate.json
      - name: Retain sanitized six-PE evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foo_doujinstyle-binskim-evidence-attempt-${{ github.run_attempt }}
          path: dist/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Retain exact deterministic component
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foo_doujinstyle-windows-wip-attempt-${{ github.run_attempt }}
          path: dist/build/*.fb2k-component
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: ci-provenance
    # This is CI provenance, never an approved release.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [component]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download package from this exact workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foo_doujinstyle-windows-wip-attempt-${{ github.run_attempt }}
          path: dist/package
      - name: Download six-PE security evidence from same workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foo_doujinstyle-binskim-evidence-attempt-${{ github.run_attempt }}
          path: dist/evidence
      - name: Test provenance gate and tamper-rejection cases
        run: python3 -m unittest -v tools.test_attestation_gate
      - name: Verify exact source/run/package and six-PE policy
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          python3 -m tools.attestation_gate \
            --package-dir dist/package --evidence-dir dist/evidence \
            --source-commit "$SOURCE_COMMIT" --run-id "$CI_RUN_ID" \
            --output dist/security-predicate.json
      - name: Sign standard build provenance for exact package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/package/*.fb2k-component
      - name: Sign scoped six-PE binary security statement
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/package/*.fb2k-component
          predicate-type: https://github.com/bgonz808/foo_doujinstyle/security/attestation-v1
          predicate-path: dist/security-predicate.json
      - name: Archive human-readable signed-claim input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foo_doujinstyle-ci-provenance-input
          path: dist/security-predicate.json
          if-no-files-found: error
          retention-days: 30
