name: Windows Build and BinSkim
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: winbuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  component:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Windows PowerShell build script parses
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'native/build.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - name: Fetch and verify pinned foobar2000 SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.foobar2000.org/downloads/SDK-2026-10-01.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'SDK-2026-10-01.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'd4c55077336fae81bf8df0259b5b2748fa45ea84132c656ead93eb123cbcdc26'
          if ($actual -ne $expected) { throw "foobar SDK digest mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP 'foobar-sdk'
          New-Item -ItemType Directory $dest -Force | Out-Null
          & 7z.exe x $archive "-o$dest" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'SDK extraction failed' }
          $direct = Join-Path $dest 'foobar2000\SDK\foobar2000.h'
          if (!(Test-Path $direct)) {
            $headers = @(Get-ChildItem -LiteralPath $dest -Recurse -Filter foobar2000.h)
            $headers = @($headers | Where-Object { $_.FullName -match 'foobar2000[\\/]SDK[\\/]foobar2000\.h$' })
            if ($headers.Count -ne 1) { throw 'SDK source root ambiguous or missing' }
            $dest = (Resolve-Path (Join-Path $headers[0].Directory.FullName '..\..')).Path
          }
          "FOOBAR_SDK_ROOT=$dest" >> $env:GITHUB_ENV
      - name: Configure verified foobar2000 SDK projects
        run: ./tools/configure_foobar_sdk.ps1 -SdkRoot $env:FOOBAR_SDK_ROOT
      - name: Fetch and verify official pinned LLVM 23.1.6 for Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '23.1.6'
          $asset = "clang+llvm-$version-x86_64-pc-windows-msvc.tar.xz"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$asset"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri $url -OutFile $archive
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '16af05919cf36958dfb4ddaa4fc4d9d4ff577f5daeb76bc112ea49cd8ced82b2'
          if ($digest -ne $expected) { throw "LLVM release digest mismatch: $digest" }
          $stage = Join-Path $env:RUNNER_TEMP 'llvm-23.1.6'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          & 7z.exe x $archive "-o$stage" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not decompress pinned LLVM archive" }
          $tarballs = @(Get-ChildItem -LiteralPath $stage -Filter '*.tar' -File)
          if ($tarballs.Count -ne 1) { throw "Expected exactly one LLVM tarball, found $($tarballs.Count)" }
          & 7z.exe x $tarballs[0].FullName "-o$stage" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract pinned LLVM archive" }
          $found = @(Get-ChildItem -LiteralPath $stage -Recurse -File -Filter 'clang-cl.exe')
          if ($found.Count -ne 1) { throw "Expected exactly one LLVM clang-cl.exe, found $($found.Count)" }
          $llvm = (Resolve-Path (Join-Path $found[0].DirectoryName '..')).Path
          foreach ($name in @('clang-cl.exe', 'clang-tidy.exe', 'lld-link.exe', 'llvm-readobj.exe')) {
            if (!(Test-Path (Join-Path $llvm "bin\$name"))) { throw "Pinned LLVM missing $name" }
          }
          $banner = (& (Join-Path $llvm 'bin\clang-cl.exe') --version) -join "`n"
          if ($banner -notmatch 'clang version 23\.1\.6\b') { throw "Unexpected compiler: $banner" }
          $tidy = (& (Join-Path $llvm 'bin\clang-tidy.exe') --version) -join "`n"
          if ($tidy -notmatch 'version 23\.1\.6\b') { throw "Unexpected clang-tidy: $tidy" }
          "LLVM_INSTALL_DIR=$llvm" >> $env:GITHUB_ENV
          Write-Host "Pinned LLVM $version SHA-256 $digest"
      - name: Install documented Microsoft ARM64 and ARM64EC Spectre runtimes
        run: ./tools/install_msvc_spectre.ps1

      - name: Require pinned ARM64EC Spectre CRT before any Windows PE build
        run: ./tools/verify_msvc_runtime.ps1 -Output (Join-Path $env:RUNNER_TEMP 'msvc-runtime.json')
      - name: Compile Win32, x64 and ARM64EC binaries
        run: |
          $version = & py -3 tools/build_identity.py | ConvertFrom-Json
          Write-Host "Full source version: $($version.version)"
          if ($version.dirty) { throw 'Dirty source tree: refuse Windows build' }
          ./native/build.ps1 -SdkRoot $env:FOOBAR_SDK_ROOT -Platform Win32,x64,ARM64EC -WindowsSdkVersion '10.0.26100.0' -LLVMInstallDir $env:LLVM_INSTALL_DIR -LLVMToolsVersion '23.1.6' -Arm64ecWithMsvc -Win32WithMsvc -X64WithMsvc -MsvcToolsVersion '14.44.35207' -VerifySharedSqliteCompilation
      - name: Verify shared-library graph and actual Windows native worker SQLite contracts
        run: |
          $ErrorActionPreference = 'Stop'
          py -3 -m unittest -v tools.test_windows_projects
          if ($LASTEXITCODE -ne 0) { throw 'Shared-library graph contract failed' }
          foreach ($arch in @('Win32','x64')) {
            $env:DOUJINSTYLE_TEST_PUBLISHER = (Resolve-Path "native/build/$arch/publish_references.exe").Path
            & $env:DOUJINSTYLE_TEST_PUBLISHER --version
            if ($LASTEXITCODE -ne 0) { throw "Worker execution failed for $arch" }
            py -3 -m unittest -v native.test_catalog_index_plan_ipc.NativeIndexPlanTests
            if ($LASTEXITCODE -ne 0) { throw "Worker SQLite contracts failed for $arch" }
          }
          Remove-Item Env:DOUJINSTYLE_TEST_PUBLISHER
      - name: Validate and publish partial vendored-input SPDX inventory
        run: |
          py -3 -m unittest -v tools.test_source_sbom
          py -3 -m tools.source_sbom --root . --commit $env:GITHUB_SHA --output ci-evidence/source-inputs.spdx.json
      - name: Verify all three PE target architectures
        run: |
          py -3 -m unittest -v tools.test_verify_pe_targets
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe missing; cannot inspect ARM64X' }
          $linkers = @(& $vswhere -latest -products '*' -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\link.exe')
          $link = @($linkers | Where-Object { $_ -match '[\\/]14[.]44[.]35207[\\/]' })
          if ($link.Count -ne 1 -or !(Test-Path -LiteralPath $link[0])) {
            throw 'Pinned MSVC 14.44.35207 linker unavailable; cannot verify ARM64EC hybrid PE'
          }
          Write-Host "Verifying ARM64X images with $($link[0])"
          py -3 tools/verify_pe_targets.py --build-dir native/build --require Win32 x64 ARM64EC --link-exe $link[0]
      - name: Verify BinSkim policy and evidence tests
        run: py -3 -m unittest -v tools.test_binskim_policy tools.test_binskim_evidence tools.test_binskim_diagnostics
      - name: Verify Spectre build configuration contracts
        run: py -3 -m unittest -v tools.test_spectre_configuration
      - name: Verify provenance gate identity and tamper rejection
        run: py -3 -m unittest -v tools.test_attestation_gate
      - name: Scan built Windows PE images with BinSkim
        run: ./tools/run_binskim.ps1
      - name: Collect sanitized BinSkim evidence on failure or success
        if: ${{ !cancelled() }}
        run: |
          py -3 -m tools.binskim_evidence --build native/build `
            --reports (Join-Path $env:RUNNER_TEMP 'binskim-sarif') `
            --baseline tools/binskim-baseline.json --policy security/bin-policy.json `
            --version-file VERSION --output ci-evidence
      - name: Analyze BA2024 linked-object evidence without exposing paths
        if: ${{ !cancelled() }}
        run: |
          py -3 -m tools.binskim_diagnostics --reports (Join-Path $env:RUNNER_TEMP 'binskim-sarif') --output ci-evidence/mitigation-diagnostics.json
      - name: Strict Windows x64 first-party Clang analysis from actual compiler commands
        run: |
          $ErrorActionPreference = 'Stop'
          py -3 -m unittest -v tools.test_windows_analysis
          if ($LASTEXITCODE -ne 0) { throw 'Windows analysis contract tests failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe')
          if ($msbuild.Count -ne 1) { throw 'MSBuild executable missing or ambiguous' }
          py -3 native/analyze_windows.py --msbuild $msbuild[0] --sdk $env:FOOBAR_SDK_ROOT `
            --llvm-bin (Join-Path $env:LLVM_INSTALL_DIR 'bin') --platform x64 --jobs 2 `
            --output (Join-Path $env:RUNNER_TEMP 'windows-analysis') --evidence ci-evidence/windows-analysis.json
          if ($LASTEXITCODE -ne 0) { throw 'Strict Windows Clang analysis failed' }
      - name: Retain MSVC toolchain hash inventory even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foo_doujinstyle-msvc-inventory
          path: ${{ runner.temp }}/msvc-runtime.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload BinSkim diagnostics even when the security gate fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: foo_doujinstyle-binskim-evidence
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Report component checksum
        run: |
          Get-ChildItem native/build/*.fb2k-component | ForEach-Object {
            $sha = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$($_.Name) sha256=$sha"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: foo_doujinstyle-windows-wip
          path: native/build/*.fb2k-component
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: ci-provenance
    # This is CI provenance, never an approved release.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [component]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download package from this exact workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foo_doujinstyle-windows-wip
          path: dist/package
      - name: Download six-PE security evidence from same workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foo_doujinstyle-binskim-evidence
          path: dist/evidence
      - name: Test provenance gate and tamper-rejection cases
        run: python3 -m unittest -v tools.test_attestation_gate
      - name: Verify exact source/run/package and six-PE policy
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          python3 -m tools.attestation_gate \
            --package-dir dist/package --evidence-dir dist/evidence \
            --source-commit "$SOURCE_COMMIT" --run-id "$CI_RUN_ID" \
            --output dist/security-predicate.json
      - name: Sign standard build provenance for exact package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/package/*.fb2k-component
      - name: Sign scoped six-PE binary security statement
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/package/*.fb2k-component
          predicate-type: https://github.com/bgonz808/foo_doujinstyle/security/attestation-v1
          predicate-path: dist/security-predicate.json
      - name: Archive human-readable signed-claim input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foo_doujinstyle-ci-provenance-input
          path: dist/security-predicate.json
          if-no-files-found: error
          retention-days: 30
