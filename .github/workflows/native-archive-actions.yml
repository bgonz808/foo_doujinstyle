name: Native explicit download and repair contracts
on:
  push:
    branches: [migration/native-archive-actions]
  pull_request:
    branches: [migration/native-foreground-search]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and exercise native download/repair state machine
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O0 -g0 -Wall -Wextra -Werror -I native \
            native/test_catalog_explicit_job_frontend.cpp -o "$RUNNER_TEMP/native_explicit"
          "$RUNNER_TEMP/native_explicit"
