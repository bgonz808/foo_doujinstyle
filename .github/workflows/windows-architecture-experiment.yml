name: Windows architecture matrix latency experiment (unqualified)
on:
  push:
    branches: [ci/windows-architecture-matrix-v0.0.238]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: win-arch-experiment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  architecture:
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64, ARM64EC]
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Windows PowerShell build script parses
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'native/build.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - name: Fetch and verify pinned foobar2000 SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.foobar2000.org/downloads/SDK-2026-10-01.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'SDK-2026-10-01.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'd4c55077336fae81bf8df0259b5b2748fa45ea84132c656ead93eb123cbcdc26'
          if ($actual -ne $expected) { throw "foobar SDK digest mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP 'foobar-sdk'
          New-Item -ItemType Directory $dest -Force | Out-Null
          & 7z.exe x $archive "-o$dest" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'SDK extraction failed' }
          $direct = Join-Path $dest 'foobar2000\SDK\foobar2000.h'
          if (!(Test-Path $direct)) {
            $headers = @(Get-ChildItem -LiteralPath $dest -Recurse -Filter foobar2000.h)
            $headers = @($headers | Where-Object { $_.FullName -match 'foobar2000[\\/]SDK[\\/]foobar2000\.h$' })
            if ($headers.Count -ne 1) { throw 'SDK source root ambiguous or missing' }
            $dest = (Resolve-Path (Join-Path $headers[0].Directory.FullName '..\..')).Path
          }
          "FOOBAR_SDK_ROOT=$dest" >> $env:GITHUB_ENV
      - name: Configure verified foobar2000 SDK projects
        run: ./tools/configure_foobar_sdk.ps1 -SdkRoot $env:FOOBAR_SDK_ROOT
      - name: Install documented Microsoft ARM64 and ARM64EC Spectre runtimes
        run: ./tools/install_msvc_spectre.ps1

      - name: Require pinned ARM64EC Spectre CRT before any Windows PE build
        run: ./tools/verify_msvc_runtime.ps1 -Output (Join-Path $env:RUNNER_TEMP 'msvc-runtime.json')
      - name: Compile one architecture using exact MSVC pins
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & py -3 tools/build_identity.py | ConvertFrom-Json
          if ($version.dirty) { throw 'Dirty source tree' }
          ./native/build.ps1 -SdkRoot $env:FOOBAR_SDK_ROOT -Platform $env:TARGET_ARCH -WindowsSdkVersion '10.0.26100.0' -MsvcToolsVersion '14.44.35207' -PinnedMsvcOnly -VerifySharedSqliteCompilation
      - name: Verify local PE identity and worker embedding
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $link = @(& $vswhere -latest -products '*' -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\link.exe' | Where-Object { $_ -match '[\\/]14[.]44[.]35207[\\/]' })
          if ($link.Count -ne 1) { throw 'Pinned linker unavailable' }
          py -3 tools/verify_pe_targets.py --build-dir native/build --require $env:TARGET_ARCH --link-exe $link[0]
          if ($LASTEXITCODE -ne 0) { throw 'PE architecture failed' }
          py -3 -c "from pathlib import Path; import os,hashlib; from zipfile import ZipFile; b=Path('native/build'); a=os.environ['TARGET_ARCH']; d=b/a; dll=(d/'foo_doujinstyle.dll').read_bytes(); worker=(d/'publish_references.exe').read_bytes(); assert len(worker)>256 and worker in dll; p=list(b.glob('*.fb2k-component')); assert len(p)==1; z=ZipFile(p[0]); names=[n for n in z.namelist() if n.endswith('.dll')]; expected={'Win32':'foo_doujinstyle.dll','x64':'x64/foo_doujinstyle.dll','ARM64EC':'arm64ec/foo_doujinstyle.dll'}; assert names==[expected[a]] and z.read(names[0])==dll; print('MATRIX-METRIC arch='+a+' dll_sha256='+hashlib.sha256(dll).hexdigest()+' worker_sha256='+hashlib.sha256(worker).hexdigest())"
          if ($LASTEXITCODE -ne 0) { throw 'Package/worker binding failed' }
          if ($env:TARGET_ARCH -ne 'ARM64EC') {
            $env:DOUJINSTYLE_TEST_PUBLISHER = (Resolve-Path "native/build/$env:TARGET_ARCH/publish_references.exe").Path
            & $env:DOUJINSTYLE_TEST_PUBLISHER --version
            if ($LASTEXITCODE -ne 0) { throw 'Worker execution failed' }
            py -3 -m unittest -v native.test_catalog_index_plan_ipc.NativeIndexPlanTests
            if ($LASTEXITCODE -ne 0) { throw 'Worker SQLite contracts failed' }
          }
      - name: Local two-PE BinSkim and mitigation gate
        run: ./tools/run_binskim.ps1 -Architecture $env:TARGET_ARCH
      - name: Fetch and verify official pinned LLVM 23.1.6 for Windows
        if: matrix.arch == 'x64'
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '23.1.6'
          $asset = "clang+llvm-$version-x86_64-pc-windows-msvc.tar.zst"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$asset"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $clock = [Diagnostics.Stopwatch]::StartNew()
          Invoke-WebRequest -Uri $url -OutFile $archive
          Write-Host "LLVM-METRIC stage=download seconds=$([Math]::Round($clock.Elapsed.TotalSeconds,3)) bytes=$((Get-Item -LiteralPath $archive).Length) compression=zstd"
          $clock.Restart()
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '7623f582089983c1cb51030cf1996514b19464e5669099571b399e8543770155'
          if ($digest -ne $expected) { throw "LLVM release digest mismatch: $digest" }
          Write-Host "LLVM-METRIC stage=archive_verify seconds=$([Math]::Round($clock.Elapsed.TotalSeconds,3))"
          $clock.Restart()
          $stage = Join-Path $env:RUNNER_TEMP 'llvm-23.1.6'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          & 7z.exe x $archive "-o$stage" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not decompress pinned LLVM archive" }
          $tarballs = @(Get-ChildItem -LiteralPath $stage -Filter '*.tar' -File)
          if ($tarballs.Count -ne 1) { throw "Expected exactly one LLVM tarball, found $($tarballs.Count)" }
          & 7z.exe x $tarballs[0].FullName "-o$stage" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract pinned LLVM archive" }
          $found = @(Get-ChildItem -LiteralPath $stage -Recurse -File -Filter 'clang-cl.exe')
          if ($found.Count -ne 1) { throw "Expected exactly one LLVM clang-cl.exe, found $($found.Count)" }
          $llvm = (Resolve-Path (Join-Path $found[0].DirectoryName '..')).Path
          foreach ($name in @('clang-cl.exe', 'clang-tidy.exe', 'lld-link.exe', 'llvm-readobj.exe')) {
            if (!(Test-Path (Join-Path $llvm "bin\$name"))) { throw "Pinned LLVM missing $name" }
          }
          $banner = (& (Join-Path $llvm 'bin\clang-cl.exe') --version) -join "`n"
          if ($banner -notmatch 'clang version 23\.1\.6\b') { throw "Unexpected compiler: $banner" }
          $tidy = (& (Join-Path $llvm 'bin\clang-tidy.exe') --version) -join "`n"
          if ($tidy -notmatch 'version 23\.1\.6\b') { throw "Unexpected clang-tidy: $tidy" }
          # Same release/tool binaries as the previously qualified XZ archive.
          $knownTools = @{
            'clang-cl.exe' = '0d1fb4523a41c8ec722cdb72909a0a8fff1343700125b3f11d5cf83063a4d7e3'
            'clang-tidy.exe' = '5d6310f76e6f7055a3bafe9bac2d36b4d7cfc58a8c5cad913cc0ec30090b9529'
          }
          foreach ($name in $knownTools.Keys) {
            $actual = (Get-FileHash -LiteralPath (Join-Path $llvm "bin\$name") -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $knownTools[$name]) { throw "LLVM binary changed across archive formats: $name" }
          }
          Write-Host "LLVM-METRIC stage=extract_and_verify seconds=$([Math]::Round($clock.Elapsed.TotalSeconds,3))"
          "LLVM_INSTALL_DIR=$llvm" >> $env:GITHUB_ENV
          Write-Host "Pinned LLVM $version SHA-256 $digest"
      - name: Strict Windows x64 first-party Clang analysis from actual compiler commands
        if: matrix.arch == 'x64'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3 -m unittest -v tools.test_windows_analysis
          if ($LASTEXITCODE -ne 0) { throw 'Windows analysis contract tests failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe')
          if ($msbuild.Count -ne 1) { throw 'MSBuild executable missing or ambiguous' }
          py -3 native/analyze_windows.py --msbuild $msbuild[0] --sdk $env:FOOBAR_SDK_ROOT `
            --llvm-bin (Join-Path $env:LLVM_INSTALL_DIR 'bin') --platform x64 --jobs 2 `
            --output (Join-Path $env:RUNNER_TEMP 'windows-analysis') --evidence ci-evidence/windows-analysis.json
          if ($LASTEXITCODE -ne 0) { throw 'Strict Windows Clang analysis failed' }
      - name: Retain sanitized analysis evidence only
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: experimental-matrix-x64-analysis
          path: ci-evidence/windows-analysis.json
          if-no-files-found: error
          retention-days: 2
