name: Offline media fixture matrix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ci/binskim]
  workflow_dispatch:
permissions:
  contents: read
env:
  MEDIA_MATRIX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: media-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  media-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline fixture and HTTP contract tests
        run: |
          set -euo pipefail
          mkdir -p build-media/tests
          python3 -m tools.quality.unittest_runner --start tools \
            --pattern 'test_media_*.py' --suite-name media-matrix \
            --output build-media/tests/media-matrix.xml
      - name: Generate and verify codec/container/archive matrix
        run: |
          set -euo pipefail
          start=$SECONDS
          python3 -m tools.media_matrix --output build-media --fixture-lock quality/audio-fixtures/lock.json --repeats 3
          {
            printf 'Corpus verification, ZIP regeneration and transport: %s s\n' "$((SECONDS-start))"
            cat build-media/summary.md
            echo "Encoder installation: eliminated (0 packages, 0 bytes)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Render offline media compatibility viewer
        run: |
          set -euo pipefail
          python3 -m tools.media_report --input build-media --output build-media/report.html
      - name: Upload synthetic fixture/evidence bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-fixture-matrix
          path: build-media/
          if-no-files-found: error
          retention-days: 14
